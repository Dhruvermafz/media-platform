server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Share links carry a secret token in the URL (/s/:token). Never leak the
  # page URL to third parties via the Referer header, and don't let the shell
  # be framed or content-sniffed.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Hashed build output: safe to cache forever (file name changes on every build).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The service worker and app shell must revalidate on every load, or users
  # keep running an old build after a deploy (the SW itself controls updates).
  location = /sw.js            { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; add_header Content-Type "application/manifest+json" always; try_files $uri =404; }
  location = /index.html       { add_header Cache-Control "no-cache" always; add_header Referrer-Policy "no-referrer" always; }

  # Single-page app: unknown paths (/library, /collections/:id, /s/:token ...)
  # are client-side routes.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }
}
