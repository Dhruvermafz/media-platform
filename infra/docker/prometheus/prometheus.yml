global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: image-worker
    static_configs:
      - targets: ["image-worker:9100"]

  - job_name: video-worker
    static_configs:
      - targets: ["video-worker:9100"]

  - job_name: thumbnail-worker
    static_configs:
      - targets: ["thumbnail-worker:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
