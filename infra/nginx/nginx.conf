worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  client_max_body_size 0; # uploads go direct to object storage, not through this proxy

  upstream api_upstream {
    server api:3000;
  }

  upstream frontend_upstream {
    server frontend:80;
  }

  server {
    listen 80;

    # Server-Sent Events: must not be buffered or cut off by the default 60s
    # read timeout, or the browser only sees updates in bursts / reconnects
    # constantly. Declared before the generic /api/ block so it wins.
    location = /api/events {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
    }
  }
}
