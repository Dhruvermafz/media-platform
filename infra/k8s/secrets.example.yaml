# DO NOT apply this file directly - it contains placeholder values.
# Create the real secret imperatively instead (see migration.md §11):
#
#   kubectl -n media-platform create secret generic app-secrets \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --from-literal=REDIS_URL="redis://..." \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=S3_ENDPOINT="https://s3.us-east-1.amazonaws.com" \
#     --from-literal=S3_ACCESS_KEY="..." \
#     --from-literal=S3_SECRET_KEY="..."
#
# This file exists only to document the required keys and is kept out of
# any `kubectl apply -f infra/k8s/` glob a script might run - the
# filename ends in .example.yaml specifically so it's not picked up by
# `kubectl apply -f infra/k8s/*.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: media-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/media_platform"
  REDIS_URL: "redis://REPLACE_ME:6379"
  JWT_SECRET: "REPLACE_ME_64_CHAR_RANDOM_STRING"
  S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
