apiVersion: v1
kind: Namespace
metadata:
  name: media-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: media-platform
data:
  # Non-secret configuration only. DATABASE_URL, REDIS_URL, JWT_SECRET,
  # and S3_ACCESS_KEY/S3_SECRET_KEY live in the "app-secrets" Secret
  # instead (see secrets.example.yaml and migration.md §11) even though
  # some — like S3_ENDPOINT — aren't sensitive by themselves, to keep
  # everything storage/credential-related in one place operators must
  # rotate together.
  NODE_ENV: "production"
  PORT: "3000"
  JWT_EXPIRES_IN: "1h"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_MAX_REQUESTS: "100"
  ASSET_CACHE_TTL_SECONDS: "30"
  S3_REGION: "us-east-1"
  S3_BUCKET: "media-platform-prod"
  S3_FORCE_PATH_STYLE: "false"
  METRICS_PORT: "9100"
  # Emails promoted to ADMIN on register/login. Set to your operators.
  ADMIN_EMAILS: "admin@example.com"
  TRASH_RETENTION_DAYS: "30"
  ORPHAN_UPLOAD_TTL_HOURS: "24"
  CLEANUP_ENABLED: "true"
  # S3_PUBLIC_ENDPOINT is intentionally unset: on real S3 the browser and the
  # cluster use the same endpoint. Set it only if they differ (e.g. an
  # internal MinIO service name vs. a public storage hostname).
